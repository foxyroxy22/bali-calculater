<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>발리 경비 계산기</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="view-switch">
      <button class="view-btn active" data-view="calculator">계산기</button>
      <button class="view-btn" data-view="ledger">가계부</button>
    </header>

    <main>
      <section id="calculator-view" class="view active">
        <div class="tax-mode-toggle">
          <button class="tax-mode-btn active" data-mode="none">가격만</button>
          <button class="tax-mode-btn" data-mode="plus">+</button>
          <button class="tax-mode-btn" data-mode="plusplus">++</button>
        </div>

        <div class="rate-inputs">
          <label>세금 %<input type="number" id="tax-rate-input" min="0" step="0.1"></label>
          <label>서비스차지 %<input type="number" id="service-rate-input" min="0" step="0.1" disabled></label>
        </div>

        <div class="applied-rate">
          <div>
            <div class="applied-rate-label">적용 환율 (충전 평균)</div>
            <div id="applied-rate-display" class="applied-rate-value">-</div>
          </div>
          <div class="applied-rate-actions">
            <button id="add-topup-btn" class="btn-link-sm">+ 충전 입력</button>
            <button id="add-withdrawal-btn" class="btn-link-sm">+ 현금 인출</button>
          </div>
        </div>
        <div id="applied-balance-display" class="applied-balance"></div>

        <div class="payment-method-toggle">
          <button class="payment-method-btn active" data-method="card">카드</button>
          <button class="payment-method-btn" data-method="cash">현금</button>
        </div>

        <div class="date-input">
          <label>날짜<input type="date" id="date-input"></label>
        </div>

        <div id="items-list" class="items-list"></div>
        <button id="add-item-btn" class="btn-outline">+ 메뉴 추가</button>

        <div class="totals">
          <div class="totals-row"><span>소계</span><span id="subtotal-display">Rp 0</span></div>
          <div class="totals-row"><span>추가요금</span><span id="extra-display">Rp 0</span></div>
          <div class="totals-row total-final"><span>총액</span><span id="total-idr-display">Rp 0</span></div>
          <div class="totals-row total-krw"><span>원화 총액</span><span id="total-krw-display">₩0</span></div>
        </div>

        <label class="memo-field">메모<input type="text" id="memo-input" placeholder="예: 우붓 맛집"></label>

        <button id="save-entry-btn" class="btn-primary" disabled>저장하기</button>
      </section>

      <section id="ledger-view" class="view">
        <div class="date-nav">
          <div class="date-nav-center">
            <button id="date-prev-btn" class="date-nav-btn" aria-label="이전 날짜">‹</button>
            <span id="ledger-current-date" class="date-nav-label"></span>
            <button id="date-next-btn" class="date-nav-btn" aria-label="다음 날짜">›</button>
          </div>
          <label class="switch-field switch-field-sm">
            전체보기
            <input type="checkbox" id="show-all-toggle" class="switch-input">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="wallet-balance-card">
          <div class="wallet-balance-col">
            <div class="wallet-balance-label">카드 잔액</div>
            <div id="wallet-balance-card-idr" class="wallet-balance-amount">Rp 0</div>
            <div id="wallet-balance-card-krw" class="wallet-balance-sub">₩0</div>
          </div>
          <div class="wallet-balance-divider"></div>
          <div class="wallet-balance-col">
            <div class="wallet-balance-label">현금 잔액</div>
            <div id="wallet-balance-cash-idr" class="wallet-balance-amount">Rp 0</div>
            <div id="wallet-balance-cash-krw" class="wallet-balance-sub">₩0</div>
          </div>
        </div>

        <div id="ledger-list" class="ledger-list"></div>

        <div class="ledger-summary">
          <span id="ledger-summary-idr">Rp 0</span>
          <span id="ledger-summary-krw">₩0</span>
        </div>

        <div class="export-widget">
          <button id="export-btn" class="export-fab" aria-label="내보내기">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v12" />
              <path d="M7 10l5 5 5-5" />
              <path d="M5 21h14" />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <div id="topup-overlay" class="export-overlay" hidden>
      <div class="export-modal">
        <div class="export-modal-header">
          <span>충전 입력</span>
        </div>
        <label class="modal-field">날짜<input type="date" id="topup-date-input"></label>
        <label class="modal-field">충전한 원화 (₩)<input type="number" id="topup-krw-input" min="0" placeholder="예: 803000"></label>
        <label class="modal-field">받은 루피아 (Rp)<input type="number" id="topup-idr-input" min="0" placeholder="예: 10000000"></label>
        <div class="modal-rate-preview">환율: <span id="topup-rate-preview">-</span></div>
        <button id="topup-confirm-btn" class="btn-primary" disabled>충전 저장</button>
      </div>
    </div>

    <div id="withdrawal-overlay" class="export-overlay" hidden>
      <div class="export-modal">
        <div class="export-modal-header">
          <span>현금 인출</span>
        </div>
        <label class="modal-field">날짜<input type="date" id="withdrawal-date-input"></label>
        <label class="modal-field">인출한 루피아 (Rp)<input type="number" id="withdrawal-idr-input" min="0" placeholder="예: 500000"></label>
        <label class="modal-field">수수료 (Rp, 선택)<input type="number" id="withdrawal-fee-input" min="0" placeholder="예: 25000"></label>
        <button id="withdrawal-confirm-btn" class="btn-primary" disabled>인출 저장</button>
      </div>
    </div>

    <div id="export-overlay" class="export-overlay" hidden>
      <div class="export-modal">
        <div class="export-modal-header">
          <span>내보낼 날짜 선택</span>
          <button id="export-select-all-btn" class="btn-link-sm">전체 선택</button>
        </div>
        <div id="export-date-list" class="export-date-list"></div>
        <button id="export-confirm-btn" class="btn-primary">내보내기</button>
      </div>
    </div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="shared">공금</button>
      <button class="tab-btn" data-tab="personal">개인</button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
